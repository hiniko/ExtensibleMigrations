name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.3.0
        with:
          allowed-commit-types: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test tests/EntityFrameworkCore.ExtensibleMigrations.Tests/ -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - run: dotnet pack src/EntityFrameworkCore.ExtensibleMigrations/ -c Release --no-build -o ./artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/test-results.trx
            **/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  # Reads compat-matrix.json and emits its `matrix` array as the strategy
  # matrix for the next job. Keeps version sweeps declarative — add a cell to
  # the JSON and CI picks it up without YAML edits.
  prepare-compat-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "matrix=$(jq -c '.matrix' compat-matrix.json)" >> "$GITHUB_OUTPUT"

  compat-test:
    needs: [build-and-test, prepare-compat-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.prepare-compat-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.cell.dotnetSdkVersion }}
      - name: Run cell
        run: bash scripts/run-compat-cell.sh "${{ matrix.cell.efCoreVersion }}" "${{ matrix.cell.npgsqlEfCoreVersion }}" "${{ matrix.cell.dotnetEfToolVersion }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-results-${{ matrix.cell.name }}
          path: '**/TestResults/*.trx'
